name: Build FloppyKernel

on:
  workflow_dispatch:
  schedule:
    - cron: '0 16 * * *'

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # ckbuild.sh sets USE_CCACHE=1 and build.sh exports CC="ccache clang",
      # so ccache is already in the compile path. What was missing is a cache
      # directory that survives the job, plus the settings that let a restored
      # cache actually hit.
      # NOTE: CCACHE_DIR is deliberately NOT set here. Job-level env cannot use
      # the runner context; it is exported from the Configure ccache step below.
      # Required. The default compilercheck is "mtime", and a fresh checkout
      # gives the vendored clang a new mtime on every run, so every object would
      # miss and the restored cache would be dead weight. Hash the contents.
      CCACHE_COMPILERCHECK: content
      CCACHE_BASEDIR: ${{ github.workspace }}
      CCACHE_NOHASHDIR: "true"
      CCACHE_MAXSIZE: 2G
      CCACHE_SLOPPINESS: time_macros,include_file_mtime,include_file_ctime,file_stat_matches
    steps:

      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Clean
        uses: rokibhasansagar/slimhub_actions@main

      - name: Prepare enviroment
        run: |
          sudo apt update
          DEBIAN_FRONTEND=noninteractive sudo apt install -yq \
            brotli zip zstd tar lz4 cpio xz-utils flex bc kmod ccache binutils-aarch64-linux-gnu gcc-aarch64-linux-gnu
          echo "${{ secrets.CHAT_ID }}" >> "../chat_ci"
          echo "${{ secrets.TOKEN }}" >> "../bot_token"

      - name: Restore ccache
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/ccache
          # Save a fresh entry every run, restore the most recent previous one.
          # ccache is content-addressed, so a cache from an older commit is still
          # almost entirely valid: a one-file change recompiles one object.
          key: ccache-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            ccache-${{ runner.os }}-

      - name: Configure ccache
        run: |
          # RUNNER_TEMP is available to the shell; ${{ runner.temp }} is not
          # usable in job-level env, so publish CCACHE_DIR for later steps here.
          echo "CCACHE_DIR=$RUNNER_TEMP/ccache" >> "$GITHUB_ENV"
          export CCACHE_DIR="$RUNNER_TEMP/ccache"
          mkdir -p "$CCACHE_DIR"
          ccache -M 2G
          ccache -z
          ccache -s

      - name: Build (KernelSU Next)
        run: |
          rm -f kernel_build/*.zip kernel_build/*.tar kernel_build/TARs_*.zip log.txt || true
          rm -rf kernel_build/images || true
          mkdir -p kernel_build/images
          ./do_build.sh tkq
          ccache -s

      - name: Prepare artifacts (KernelSU Next)
        id: artifacts_tk
        run: |
          set -e
          shopt -s nullglob

          short_sha="$(echo "$GITHUB_SHA" | cut -c1-7)"
          variant_name="KSUNext"

          zips=(kernel_build/*.zip)
          if [ ${#zips[@]} -ne 1 ]; then
            echo "ERROR: expected exactly 1 flashable zip, got ${#zips[@]}";
            ls -la kernel_build || true
            exit 1
          fi
          zip_path="${zips[0]}"
          zip_name="$(basename "$zip_path")"
          zip_stem="${zip_name%.zip}"
          echo "zip_path=$zip_path" >> "$GITHUB_OUTPUT"
          echo "zip_name=$zip_name" >> "$GITHUB_OUTPUT"
          echo "zip_stem=$zip_stem" >> "$GITHUB_OUTPUT"

          tar_files=(kernel_build/*.tar)
          if [ ${#tar_files[@]} -lt 1 ]; then
            echo "ERROR: expected at least 1 tar, got 0";
            ls -la kernel_build || true
            exit 1
          fi
          tar_bundle="kernel_build/Floppy_TARs-${short_sha}-${variant_name}.zip"
          rm -f "$tar_bundle"
          zip -j -q "$tar_bundle" "${tar_files[@]}"
          echo "tar_bundle_path=$tar_bundle" >> "$GITHUB_OUTPUT"
          echo "tar_bundle_name=$(basename "$tar_bundle")" >> "$GITHUB_OUTPUT"

      - name: Prepare flashable payload (KernelSU Next)
        run: |
          rm -rf artifact_payload_tk
          mkdir -p artifact_payload_tk
          unzip -q "${{ steps.artifacts_tk.outputs.zip_path }}" -d artifact_payload_tk

      - name: Upload flashable zip (KernelSU Next)
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.artifacts_tk.outputs.zip_stem }}
          if-no-files-found: error
          path: artifact_payload_tk/*
          compression-level: 0

      - name: Upload TAR bundle (KernelSU Next)
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.artifacts_tk.outputs.tar_bundle_name }}
          if-no-files-found: error
          path: ${{ steps.artifacts_tk.outputs.tar_bundle_path }}

      - name: Build (SukiSU Ultra)
        run: |
          rm -f kernel_build/*.zip kernel_build/*.tar kernel_build/TARs_*.zip log.txt || true
          rm -rf kernel_build/images || true
          mkdir -p kernel_build/images
          ./do_build.sh tsq
          ccache -s

      - name: Prepare artifacts (SukiSU Ultra)
        id: artifacts_ts
        run: |
          set -e
          shopt -s nullglob

          short_sha="$(echo "$GITHUB_SHA" | cut -c1-7)"
          variant_name="ReSukiSU"

          zips=(kernel_build/*.zip)
          if [ ${#zips[@]} -ne 1 ]; then
            echo "ERROR: expected exactly 1 flashable zip, got ${#zips[@]}";
            ls -la kernel_build || true
            exit 1
          fi
          zip_path="${zips[0]}"
          zip_name="$(basename "$zip_path")"
          zip_stem="${zip_name%.zip}"
          echo "zip_path=$zip_path" >> "$GITHUB_OUTPUT"
          echo "zip_name=$zip_name" >> "$GITHUB_OUTPUT"
          echo "zip_stem=$zip_stem" >> "$GITHUB_OUTPUT"

          tar_files=(kernel_build/*.tar)
          if [ ${#tar_files[@]} -lt 1 ]; then
            echo "ERROR: expected at least 1 tar, got 0";
            ls -la kernel_build || true
            exit 1
          fi
          tar_bundle="kernel_build/Floppy_TARs-${short_sha}-${variant_name}.zip"
          rm -f "$tar_bundle"
          zip -j -q "$tar_bundle" "${tar_files[@]}"
          echo "tar_bundle_path=$tar_bundle" >> "$GITHUB_OUTPUT"
          echo "tar_bundle_name=$(basename "$tar_bundle")" >> "$GITHUB_OUTPUT"

      - name: Prepare flashable payload (SukiSU Ultra)
        run: |
          rm -rf artifact_payload_ts
          mkdir -p artifact_payload_ts
          unzip -q "${{ steps.artifacts_ts.outputs.zip_path }}" -d artifact_payload_ts

      - name: Upload flashable zip (SukiSU Ultra)
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.artifacts_ts.outputs.zip_stem }}
          if-no-files-found: error
          path: artifact_payload_ts/*
          compression-level: 0

      - name: Upload TAR bundle (SukiSU Ultra)
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.artifacts_ts.outputs.tar_bundle_name }}
          if-no-files-found: error
          path: ${{ steps.artifacts_ts.outputs.tar_bundle_path }}

      - name: Build (MamboSU)
        run: |
          rm -f kernel_build/*.zip kernel_build/*.tar kernel_build/TARs_*.zip log.txt || true
          rm -rf kernel_build/images || true
          mkdir -p kernel_build/images
          ./do_build.sh tuq
          ccache -s

      - name: Prepare artifacts (MamboSU)
        id: artifacts_tu
        run: |
          set -e
          shopt -s nullglob

          short_sha="$(echo "$GITHUB_SHA" | cut -c1-7)"
          variant_name="MamboSU"

          zips=(kernel_build/*.zip)
          if [ ${#zips[@]} -ne 1 ]; then
            echo "ERROR: expected exactly 1 flashable zip, got ${#zips[@]}";
            ls -la kernel_build || true
            exit 1
          fi
          zip_path="${zips[0]}"
          zip_name="$(basename "$zip_path")"
          zip_stem="${zip_name%.zip}"
          echo "zip_path=$zip_path" >> "$GITHUB_OUTPUT"
          echo "zip_name=$zip_name" >> "$GITHUB_OUTPUT"
          echo "zip_stem=$zip_stem" >> "$GITHUB_OUTPUT"

          tar_files=(kernel_build/*.tar)
          if [ ${#tar_files[@]} -lt 1 ]; then
            echo "ERROR: expected at least 1 tar, got 0";
            ls -la kernel_build || true
            exit 1
          fi
          tar_bundle="kernel_build/Floppy_TARs-${short_sha}-${variant_name}.zip"
          rm -f "$tar_bundle"
          zip -j -q "$tar_bundle" "${tar_files[@]}"
          echo "tar_bundle_path=$tar_bundle" >> "$GITHUB_OUTPUT"
          echo "tar_bundle_name=$(basename "$tar_bundle")" >> "$GITHUB_OUTPUT"

      - name: Prepare flashable payload (MamboSU)
        run: |
          rm -rf artifact_payload_tu
          mkdir -p artifact_payload_tu
          unzip -q "${{ steps.artifacts_tu.outputs.zip_path }}" -d artifact_payload_tu

      - name: Upload flashable zip (MamboSU)
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.artifacts_tu.outputs.zip_stem }}
          if-no-files-found: error
          path: artifact_payload_tu/*
          compression-level: 0

      - name: Upload TAR bundle (MamboSU)
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.artifacts_tu.outputs.tar_bundle_name }}
          if-no-files-found: error
          path: ${{ steps.artifacts_tu.outputs.tar_bundle_path }}

      - name: Build (Vanilla)
        run: |
          rm -f kernel_build/*.zip kernel_build/*.tar kernel_build/TARs_*.zip log.txt || true
          rm -rf kernel_build/images || true
          mkdir -p kernel_build/images
          ./do_build.sh tq
          ccache -s

      - name: Prepare artifacts (Vanilla)
        id: artifacts_t
        run: |
          set -e
          shopt -s nullglob

          short_sha="$(echo "$GITHUB_SHA" | cut -c1-7)"
          variant_name="Vanilla"

          zips=(kernel_build/*.zip)
          if [ ${#zips[@]} -ne 1 ]; then
            echo "ERROR: expected exactly 1 flashable zip, got ${#zips[@]}";
            ls -la kernel_build || true
            exit 1
          fi
          zip_path="${zips[0]}"
          zip_name="$(basename "$zip_path")"
          zip_stem="${zip_name%.zip}"
          echo "zip_path=$zip_path" >> "$GITHUB_OUTPUT"
          echo "zip_name=$zip_name" >> "$GITHUB_OUTPUT"
          echo "zip_stem=$zip_stem" >> "$GITHUB_OUTPUT"

          tar_files=(kernel_build/*.tar)
          if [ ${#tar_files[@]} -lt 1 ]; then
            echo "ERROR: expected at least 1 tar, got 0";
            ls -la kernel_build || true
            exit 1
          fi
          tar_bundle="kernel_build/Floppy_TARs-${short_sha}-${variant_name}.zip"
          rm -f "$tar_bundle"
          zip -j -q "$tar_bundle" "${tar_files[@]}"
          echo "tar_bundle_path=$tar_bundle" >> "$GITHUB_OUTPUT"
          echo "tar_bundle_name=$(basename "$tar_bundle")" >> "$GITHUB_OUTPUT"

      - name: Prepare flashable payload (Vanilla)
        run: |
          rm -rf artifact_payload_t
          mkdir -p artifact_payload_t
          unzip -q "${{ steps.artifacts_t.outputs.zip_path }}" -d artifact_payload_t

      - name: Upload flashable zip (Vanilla)
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.artifacts_t.outputs.zip_stem }}
          if-no-files-found: error
          path: artifact_payload_t/*
          compression-level: 0

      - name: Upload TAR bundle (Vanilla)
